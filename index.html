<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PenguinBear · 学习风格探索</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e8f3ee 0%, #f5efe8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .quiz-container {
    width: 100%;
    max-width: 580px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(60, 100, 80, 0.12);
    padding: 40px 38px;
    position: relative;
    min-height: 460px;
  }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* ======== WELCOME ======== */
  .welcome { text-align: center; padding: 10px 0; }
  .mascots { display: flex; justify-content: center; gap: 12px; align-items: flex-end; margin-bottom: 20px; }
  .mascots svg { width: 80px; height: 80px; }
  .welcome h1 { font-size: 28px; font-weight: 700; color: #2a5a3a; margin-bottom: 4px; letter-spacing: -0.3px; }
  .welcome .sub { font-size: 14px; color: #999; margin-bottom: 20px; }
  .welcome p { font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 8px; }
  .welcome .note { font-size: 12px; color: #bbb; font-style: italic; margin: 16px 0 24px; }

  .btn {
    display: inline-block; padding: 12px 40px; border: none; border-radius: 50px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .btn-primary { background: #4a9a6a; color: #fff; box-shadow: 0 2px 10px rgba(74,154,106,0.3); }
  .btn-primary:hover { background: #3d8a5d; transform: translateY(-2px); }
  .btn-outline { background: transparent; color: #4a9a6a; border: 2px solid #4a9a6a; }
  .btn-outline:hover { background: #f0f7f2; }

  /* ======== QUIZ ======== */
  .progress-bar { width: 100%; height: 6px; background: #e8edea; border-radius: 3px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #4a9a6a, #6abf8a); border-radius: 3px; transition: width 0.4s ease; width: 0%; }

  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .quiz-counter { font-size: 13px; color: #999; font-weight: 500; }
  .quiz-mascot svg { width: 36px; height: 36px; }

  .quiz-question { font-size: 18px; font-weight: 600; color: #2c2c2c; margin-bottom: 22px; line-height: 1.5; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .quiz-option {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border: 2px solid #e8e4e0; border-radius: 12px; cursor: pointer;
    transition: all 0.2s; font-size: 14px; color: #444; background: #fff;
  }
  .quiz-option:hover { border-color: #b0d0c0; background: #f5faf7; }
  .quiz-option.selected { border-color: #4a9a6a; background: #edf5f0; color: #2a5a3a; font-weight: 500; }
  .quiz-option .opt-icon { font-size: 20px; flex-shrink: 0; width: 28px; text-align: center; }

  .quiz-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .btn-next {
    padding: 10px 28px; background: #4a9a6a; color: #fff; border: none;
    border-radius: 50px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-next:disabled { background: #c8d8d0; cursor: not-allowed; }
  .btn-next:not(:disabled):hover { background: #3d8a5d; }
  .btn-prev { padding: 10px 20px; background: transparent; color: #999; border: none; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-prev:hover { color: #666; }

  /* ======== RESULTS ======== */
  .results { text-align: center; }
  .results .mascots svg { width: 60px; height: 60px; }
  .results h2 { font-size: 24px; font-weight: 700; color: #2a5a3a; margin-bottom: 2px; }
  .results .sub { font-size: 13px; color: #999; margin-bottom: 16px; }

  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; text-align: left; }
  .result-item { padding: 10px 14px; border-radius: 10px; background: #f8f6f4; }
  .result-item .label { font-size: 11px; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .result-item .label span { font-weight: 600; }
  .result-bar { height: 8px; border-radius: 4px; background: #e8e4e0; overflow: hidden; margin-bottom: 2px; }
  .result-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; width: 0%; }
  .fill-v { background: #2a6f97; }
  .fill-a { background: #7b4f99; }
  .fill-k { background: #4a7c3f; }
  .fill-r { background: #b87a2e; }
  .result-item .score { font-size: 11px; color: #999; }

  .result-section { background: #fcfaf8; border: 1px solid #e8e4e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; text-align: left; }
  .result-section h4 { font-size: 14px; color: #2a5a3a; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .result-section p, .result-section li { font-size: 13px; color: #555; line-height: 1.6; }
  .result-section ul { padding-left: 18px; margin-top: 4px; }
  .result-section ul li { margin-bottom: 4px; }

  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .btn-print { padding: 10px 24px; background: #e8edea; color: #555; border: none; border-radius: 50px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-print:hover { background: #d8e0dc; }

  @media (max-width: 480px) {
    .quiz-container { padding: 28px 20px; }
    .mascots svg { width: 60px; height: 60px; }
    .quiz-question { font-size: 16px; }
    .result-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="quiz-container" id="app">

  <!-- WELCOME -->
  <div class="screen active" id="screen-welcome">
    <div class="welcome">
      <div class="mascots" id="welcomeMascots"></div>
      <h1>你的学习风格是什么？</h1>
      <p class="sub">小熊和小企鹅带你来探索</p>
      <p>每个人学习的方式都不一样。有人喜欢用眼睛看，有人喜欢用耳朵听，有人喜欢动手做。</p>
      <p><strong>20道题</strong>，每题选一个你最喜欢的答案。</p>
      <p>没有对错，选最像你的就好。</p>
      <p class="note">做完之后，小熊和小企鹅会给你一份详细的学习报告 🎯</p>
      <button class="btn btn-primary" onclick="startQuiz()">开始探索 →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="quiz-header">
      <span class="quiz-counter" id="quizCounter">第 1 / 20 题</span>
      <span class="quiz-mascot" id="quizMascot"></span>
    </div>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-actions">
      <button class="btn-prev" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()" disabled>下一题 →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="screen-results">
    <div class="results">
      <div class="mascots" id="resultMascots"></div>
      <h2>你的学习报告</h2>
      <p class="sub" id="resultName"></p>

      <div class="result-grid" id="resultGrid"></div>
      <div id="resultDetail"></div>

      <div class="result-actions">
        <button class="btn btn-outline" onclick="restartQuiz()">🔄 再测一次</button>
        <button class="btn-print" onclick="window.print()">🖨️ 打印报告</button>
      </div>
      <p style="font-size:11px;color:#bbb;margin-top:12px;">做完截图发给你的老师，她会根据结果给你更多学习建议 📸</p>
    </div>
  </div>
</div>

      '背单词时边走边背，不要坐着一动不动',
      '用手比划字母的形状来记拼写',
      '用角色扮演的方法练习对话——演出来比读出来记得牢',
      '学新词时做一个动作来配合它'
    ],
    classTips:[
      '老师讲的时候拿一支笔在手上转或画——这反而能帮你集中注意力',
      '读课文时用手指或笔尖逐词指着读',
      '让学习变成游戏或比赛，你会更来劲'
    ],
    animalNote:'🧸 小熊说：你的身体是你的记忆助手！记不住的时候，试着动一动。'
  },
  R: {
    label:'读写型', emoji:'📝', color:'#b87a2e',
    title:'你是一个读写型学习者！',
    desc:'你喜欢通过"读和写"来学习。文字是你最舒服的世界。你喜欢自己看书、做笔记、列清单，安安静静地消化信息。你的笔记总是最工整的，因为你写下来的过程就是记住的过程。',
    homeTips:[
      '准备一个漂亮的笔记本，专门用来记英语',
      '把学到的句子分类写进"句子银行"',
      '读完一篇文章后，写两三句自己的感受',
      '把要背的东西写成清单，边写边记'
    ],
    classTips:[
      '上课时记笔记——不一定要记全，记关键词就行',
      '做听力练习前先看文字稿，再听',
      '写作前先列一个提纲，再展开写'
    ],
    animalNote:'🐧 小企鹅说：笔和纸是你最佳拍档！记不住的时候，试着把它写下来。'
  }
};

// ─── STATE ─────────────────────────────────────────
let current = 0;
let answers = new Array(questions.length).fill(null);
const totalQ = questions.length;
const types = ['V','A','K','R'];

document.getElementById('welcomeMascots').innerHTML = bearSvg + penguinSvg;

function startQuiz() { showScreen('screen-quiz'); renderQuestion(); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('quizQuestion').textContent = q.q;
  document.getElementById('quizCounter').textContent = `第 ${current+1} / ${totalQ} 题`;
  document.getElementById('quizMascot').innerHTML = current%2===0 ? bearSvg : penguinSvg;
  document.getElementById('progressFill').style.width = (current/totalQ*100)+'%';

  const container = document.getElementById('quizOptions');
  container.innerHTML = '';
  q.opts.forEach((opt,i) => {
    const div = document.createElement('div');
    div.className = 'quiz-option' + (answers[current]===i?' selected':'');
    div.innerHTML = `<span class="opt-icon">${opt.icon}</span><span>${opt.text}</span>`;
    div.onclick = () => selectOption(i);
    container.appendChild(div);
  });

  document.getElementById('btnPrev').style.visibility = current===0?'hidden':'visible';
  const nextBtn = document.getElementById('btnNext');
  nextBtn.textContent = current===totalQ-1?'🎉 查看结果':'下一题 →';
  nextBtn.disabled = answers[current]===null;
}

function selectOption(idx) {
  answers[current]=idx;
  document.querySelectorAll('.quiz-option').forEach((el,i)=>el.classList.toggle('selected',i===idx));
  document.getElementById('btnNext').disabled=false;
}

function nextQuestion() {
  if(answers[current]===null) return;
  if(current===totalQ-1){ showResults(); return; }
  current++; renderQuestion();
}

function prevQuestion() { if(current>0){ current--; renderQuestion(); } }

function showResults() {
  showScreen('screen-results');
  document.getElementById('resultMascots').innerHTML = bearSvg + penguinSvg;

  const scores = {V:0,A:0,K:0,R:0};
  answers.forEach((optIdx,qIdx)=>{
    if(optIdx!==null) scores[questions[qIdx].opts[optIdx].type]++;
  });

  // Sort types by score descending
  const sorted = types.slice().sort((a,b)=>scores[b]-scores[a]);
  const top = sorted[0], second = sorted[1];
  const maxScore = scores[top];

  // Check if tie
  const isTie = scores[second] === maxScore;
  const isFlexible = maxScore < 5;

  // Bars
  const grid = document.getElementById('resultGrid');
  grid.innerHTML = '';
  for(const t of types){
    const pct = Math.round(scores[t]/totalQ*100);
    grid.innerHTML += `
      <div class="result-item">
        <div class="label"><span>${T[t].emoji} ${T[t].label}</span><span>${scores[t]}题</span></div>
        <div class="result-bar"><div class="result-fill fill-${t.toLowerCase()}" style="width:${pct}%;"></div></div>
        <div class="score">${pct}%</div>
      </div>`;
  }

  // Detail
  const detail = document.getElementById('resultDetail');
  let html = '';

  // Main verdict
  if(isFlexible || isTie){
    html += `<div class="result-section"><h4>🧸🐧 你是一个"多面手型"学习者！</h4>
      <p>你没有特别固定的学习方式——这意味着你非常灵活！不同的时候用不同的方法，你都能学得很好。这对你来说是最好的策略。</p></div>`;
  } else {
    const info = T[top];
    html += `<div class="result-section"><h4>${info.emoji} ${info.title}</h4><p>${info.desc}</p></div>`;
  }

  // Secondary type (if not flexible and not tied)
  if(!isFlexible && !isTie && scores[second] >= 3){
    html += `<div class="result-section"><h4>🔀 你的"第二风格"：${T[second].emoji} ${T[second].label}</h4>
      <p>你也有不错的${T[second].label}倾向。两种风格结合效果更好——比如：<strong>${T[top].label}为主 + ${T[second].label}为辅</strong>，会是你最高效的学习模式。</p></div>`;
  }

  // Top tips
  if(!isFlexible && !isTie){
    const info = T[top];
    html += `<div class="result-section"><h4>🏠 在家可以这样学</h4><ul>${info.homeTips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
    html += `<div class="result-section"><h4>🏫 上课时可以这样做</h4><ul>${info.classTips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
    html += `<div class="result-section"><h4>${info.animalNote.split('：')[0]}</h4><p>${info.animalNote.split('：')[1]||info.animalNote}</p></div>`;
  }

  // For flexible learners, give combined tips
  if(isFlexible || isTie){
    html += `<div class="result-section"><h4>🏠 在家可以这样学</h4>
      <p>因为你很灵活，可以试试在不同场景用不同方法：</p>
      <ul>
        <li>记单词的时候，先看图片（视觉），再读出来（听觉），再写一遍（读写）</li>
        <li>复习的时候，先默写（读写），再大声读（听觉），再走动着背（动觉）</li>
        <li>用不同的方式学同一个内容，你记得最牢</li>
      </ul></div>`;
    html += `<div class="result-section"><h4>🧸🐧 小熊和小企鹅对你说</h4>
      <p>你的学习方式很多样，这是你的优势！你不需要把自己限定在一种方法里。试试在不同的场景用不同的工具，你会发现自己学什么都很快。</p></div>`;
  }

  detail.innerHTML = html;
}

function restartQuiz() { current=0; answers=new Array(questions.length).fill(null); startQuiz(); }
</script>
</body>
</html>
